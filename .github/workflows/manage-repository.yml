name: Gerenciar Repositório LSD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list = listar pacotes | build = compilar e publicar | remove = remover"
        type: choice
        required: true
        default: list
        options:
          - list
          - build
          - remove
      package:
        description: "Pacote(s): nome do diretório em LSD-OS/packages (vários separados por vírgula). Ignorado em 'list'."
        type: string
        required: false
      nodeps:
        description: "true = makepkg -d, pular dependências no build (pacotes arch=any só de arquivos de serviço; o container Arch/systemd não instala a stack dinit da Artix)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lsd-repository
  cancel-in-progress: false

env:
  ARCH: x86_64
  DB_NAME: lsd.db.tar.gz
  PACKAGES_REPO: LSD-OS/packages

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          path: repository

      - name: Checkout do repositório de pacotes
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PACKAGES_REPO }}
          path: packages

      # ---------------- LIST ----------------
      - name: Listar pacotes disponíveis
        if: inputs.action == 'list'
        run: |
          {
            echo "## 📦 Pacotes disponíveis em \`${PACKAGES_REPO}\`"
            echo
            for d in packages/*/; do
              [ -f "${d}PKGBUILD" ] || continue
              raw=$(grep -m1 '^pkgname=' "${d}PKGBUILD" | cut -d= -f2- | tr -d '"')
              ver=$(grep -m1 '^pkgver=' "${d}PKGBUILD" | cut -d= -f2 | tr -d '"')
              rel=$(grep -m1 '^pkgrel=' "${d}PKGBUILD" | cut -d= -f2 | tr -d '"')
              if [[ "$raw" == "("* ]]; then
                # split package: lista cada sub-pacote
                for n in $(echo "$raw" | tr -d '()'); do
                  echo "- **$n** ${ver:-?}-${rel:-?} (\`${d}\`)"
                done
              else
                echo "- **${raw:-$d}** ${ver:-?}-${rel:-?} (\`${d}\`)"
              fi
            done
            echo
            echo "## 🗄️ Pacotes no repositório (\`${ARCH}/lsd.db\`)"
            echo
            if [ -f "repository/${ARCH}/lsd.db.tar.gz" ]; then
              tar -xzf "repository/${ARCH}/lsd.db.tar.gz" -O --wildcards '*/desc' 2>/dev/null \
                | awk '/^%NAME%$/{getline; print "- " $0}'
            else
              echo "_(repositório vazio — nenhum pacote publicado ainda)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- BUILD ----------------
      - name: Compilar pacote(s)
        if: inputs.action == 'build'
        run: |
          if [ -z "${{ inputs.package }}" ]; then
            echo "::error::Informe o(s) pacote(s) no campo 'package'. Use a ação 'list' para ver os disponíveis."
            exit 1
          fi

          docker pull archlinux:latest

          IFS=',' read -ra PKGS <<< "${{ inputs.package }}"
          NEW_PKGS_ALL=""

          for pkg in "${PKGS[@]}"; do
            pkg="${pkg//[[:space:]]/}"
            [ -n "$pkg" ] || continue

            if [ ! -f "packages/$pkg/PKGBUILD" ]; then
              echo "::error::PKGBUILD não encontrado em packages/$pkg (o pacote existe?)"
              exit 1
            fi

            echo "::group::Compilando $pkg"
            docker run --rm \
              -e PKG="$pkg" \
              -e NODEPS="${{ inputs.nodeps }}" \
              -e RUNNER_UID="$(id -u)" \
              -e RUNNER_GID="$(id -g)" \
              -v "$GITHUB_WORKSPACE/packages:/pkgbuild" \
              archlinux:latest bash -euc '
                pacman-key --init
                pacman -Sy --noconfirm archlinux-keyring
                # dinit / elogind-dinit não existem nos repos oficiais do Arch:
                # adiciona o repo "system" da Artix (fonte dos pacotes dinit).
                # A seção PRECISA se chamar "system" (o pacman pede o .db pelo
                # nome da seção; no mirror o arquivo é system.db) e o mirror
                # master da Artix não resolve no runner do GH, por isso os
                # mirrors do pacman.conf dos profiles.
                printf "\n[system]\nServer = https://mirrors.dotsrc.org/artix-linux/repos/system/os/x86_64\nServer = https://mirror.pascalpuffke.de/artix-linux/system/os/x86_64\nSigLevel = Never\n" >> /etc/pacman.conf
                pacman -Syyu --noconfirm base-devel sudo git
                useradd -m builder
                echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
                chown -R builder:builder "/pkgbuild/$PKG"
                # nodeps=true: makepkg -d. O container Arch é systemd e não
                # aceita a stack dinit da Artix (libudev x systemd-libs, dinit
                # x systemd-sysvcompat, dbus-dinit x dbus). Pacotes arch=any
                # que só instalam arquivos não precisam das depends no build —
                # são metadados, verificados pelo pacstrap da ISO no alvo certo.
                if [ "$NODEPS" = "true" ]; then MPFLAGS="-d"; else MPFLAGS="-s"; fi
                su builder -c "cd \"/pkgbuild/$PKG\" && makepkg $MPFLAGS --noconfirm --needed"
                # devolve a posse ao usuário do runner: o chown para builder
                # deixa o diretório do pacote sem permissão para o mv que roda
                # fora do container (Permission denied no passo de mover o .zst)
                chown -R "$RUNNER_UID:$RUNNER_GID" "/pkgbuild/$PKG"
              '
            echo "::endgroup::"

            mkdir -p "repository/${ARCH}"

            # move TODOS os pacotes gerados (split packages geram vários, ex:
            # gdm -> gdm, libgdm, gdm-devel, gdm-dinit)
            shopt -s nullglob
            for f in "packages/$pkg"/*.pkg.tar.zst; do
              mv "$f" "repository/${ARCH}/"
              NEW_PKGS_ALL="$NEW_PKGS_ALL $(basename "$f")"
            done
            shopt -u nullglob

            echo "✅ $pkg compilado: $NEW_PKGS_ALL" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ -z "$NEW_PKGS_ALL" ]; then
            echo "::error::Nenhum *.pkg.tar.zst foi gerado pela compilação."
            exit 1
          fi

          echo "NEW_PKGS_ALL=${NEW_PKGS_ALL}" >> "$GITHUB_ENV"

      - name: Criar/atualizar banco do repositório (repo-add)
        if: inputs.action == 'build'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker run --rm \
            -e ARCH="$ARCH" \
            -e DB_NAME="$DB_NAME" \
            -e NEW_PKGS_ALL="$NEW_PKGS_ALL" \
            -e GPG_PRIVATE_KEY="$GPG_PRIVATE_KEY" \
            -e GPG_PASSPHRASE="$GPG_PASSPHRASE" \
            -v "$GITHUB_WORKSPACE/repository:/repository" \
            archlinux:latest bash -euc '
              cd "/repository/$ARCH"
              
              REPO_ADD_ARGS=("--remove")

              if [ -n "$GPG_PRIVATE_KEY" ]; then
                echo "==> Configurando chave GPG para assinatura de pacotes e banco..."
                mkdir -p /root/.gnupg
                chmod 700 /root/.gnupg
                echo "allow-loopback-pinentry" > /root/.gnupg/gpg-agent.conf
                echo "pinentry-mode loopback" > /root/.gnupg/gpg.conf
                
                # Importa chave privada
                echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
                
                # Obter o Key ID importado
                KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '\''/^sec/{print $5}'\'' | head -n1)
                
                # Definir confiança máxima na chave para pacman/repo-add
                echo "${KEY_ID}:6:" | gpg --import-ownertrust

                # Assina cada pacote (.pkg.tar.zst -> .pkg.tar.zst.sig)
                for pkg in $NEW_PKGS_ALL; do
                  echo "==> Assinando pacote: $pkg"
                  rm -f "${pkg}.sig"
                  if [ -n "$GPG_PASSPHRASE" ]; then
                    gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --use-agent -u "$KEY_ID" "$pkg"
                  else
                    gpg --batch --yes --detach-sign --use-agent -u "$KEY_ID" "$pkg"
                  fi
                done

                # Habilita assinatura do banco de dados (gera .db.sig e .files.sig)
                REPO_ADD_ARGS+=("--sign")
                if [ -n "$GPG_PASSPHRASE" ]; then
                  # repo-add usa gpg diretamente, exportamos flags se necessário
                  export GPG_PASSPHRASE
                fi
              else
                echo "::warning::GPG_PRIVATE_KEY não definida nos Secrets do repositório. O pacote foi publicado sem assinatura."
              fi

              # --remove: apaga do disco o arquivo antigo ao atualizar o pacote
              repo-add "${REPO_ADD_ARGS[@]}" "$DB_NAME" $NEW_PKGS_ALL
            '

      # ---------------- REMOVE ----------------
      - name: Remover pacote(s)
        if: inputs.action == 'remove'
        run: |
          if [ -z "${{ inputs.package }}" ]; then
            echo "::error::Informe o(s) pacote(s) no campo 'package'."
            exit 1
          fi
          if [ ! -f "repository/${ARCH}/lsd.db.tar.gz" ]; then
            echo "::error::Banco do repositório não existe ainda (repository/${ARCH}/lsd.db.tar.gz)."
            exit 1
          fi

          PKG_NAMES=""
          IFS=',' read -ra PKGS <<< "${{ inputs.package }}"
          for pkg in "${PKGS[@]}"; do
            pkg="${pkg//[[:space:]]/}"
            [ -n "$pkg" ] || continue
            PKG_NAMES="$PKG_NAMES $pkg"
          done

          docker run --rm \
            -e ARCH="$ARCH" \
            -e DB_NAME="$DB_NAME" \
            -e PKG_NAMES="$PKG_NAMES" \
            -v "$GITHUB_WORKSPACE/repository:/repository" \
            archlinux:latest bash -euc '
              cd "/repository/$ARCH"
              repo-remove "$DB_NAME" $PKG_NAMES
            '

          # apaga os arquivos dos pacotes removidos e suas assinaturas
          cd "repository/${ARCH}"
          for pkg in $PKG_NAMES; do
            rm -fv "${pkg}-"*.pkg.tar.zst "${pkg}-"*.pkg.tar.zst.sig
          done

      # ---------------- PÓS-PROCESSAMENTO ----------------
      - name: Substituir symlinks por cópias reais
        if: inputs.action != 'list'
        run: |
          # GitHub raw não serve symlinks: converte lsd.db / lsd.files (e suas assinaturas) em arquivos reais
          cd "repository/${ARCH}"
          for link in lsd.db lsd.files lsd.db.sig lsd.files.sig; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp -L "$target" "$link"
              echo "Symlink $link -> $target substituído por cópia real"
            fi
          done
          ls -la

      - name: Commit e push
        if: inputs.action != 'list'
        run: |
          cd repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          if [ "${{ inputs.action }}" = "build" ]; then
            msg="build: adicionar/atualizar ${{ inputs.package }}"
          else
            msg="remove: remover ${{ inputs.package }}"
          fi
          git commit -m "$msg"
          git push
